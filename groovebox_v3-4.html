<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROOVEBOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0D0F;
  --bg2:#161619;
  --card:#202024;
  --border:#303036;
  --text:#F4F1EA;
  --text2:#9B9B9F;
  --orange:#E86A33;
  --gold:#E5B94B;
  --radius:3px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; height:100%;}
body{padding-bottom:64px;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
img{max-width:100%; display:block;}
.serif{font-family:'Libre Baskerville', serif;}
::selection{background:var(--orange); color:#0D0D0F;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

/* ---------- layout shells ---------- */
#app{max-width:1180px; margin:0 auto; padding:0 20px;}
.only-mobile{display:none;}
@media (max-width:820px){
  .only-desktop{display:none !important;}
  .only-mobile{display:flex !important;}
  #app{padding:0 14px;}
}

/* ---------- header (desktop) ---------- */
header.top{
  position:sticky; top:0; z-index:50;
  background:rgba(13,13,15,.88); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.top-inner{
  max-width:1180px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:28px;
}
.logo{
  font-family:'Libre Baskerville', serif; font-weight:700; font-size:19px;
  letter-spacing:.5px; color:var(--text); white-space:nowrap;
  display:flex; align-items:center; gap:8px;
}
.logo .dot{width:8px; height:8px; border-radius:50%; background:var(--orange); display:inline-block;}
nav.primary{display:flex; gap:22px; flex:1;}
nav.primary a{
  font-size:14px; font-weight:600; color:var(--text2); padding:6px 2px;
  border-bottom:2px solid transparent; transition:color .15s;
}
nav.primary a:hover{color:var(--text);}
nav.primary a.active{color:var(--text); border-bottom-color:var(--orange);}
.search-box{
  display:flex; align-items:center; gap:8px;
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
  padding:8px 12px; width:260px; color:var(--text2);
}
.search-box input{
  background:none; border:none; outline:none; color:var(--text); font-size:13px; width:100%;
}
.avatar{
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Libre Baskerville',serif; font-weight:700; font-size:13px; color:#0D0D0F;
}

/* ---------- mobile bottom nav ---------- */
nav.mobile{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:rgba(22,22,25,.96); backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:8px 6px 10px;
  justify-content:space-around; align-items:center;
}
nav.mobile a{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10px; color:var(--text2); font-weight:600;
}
nav.mobile a.active{color:var(--orange);}
nav.mobile svg{width:20px; height:20px;}

/* ---------- section basics ---------- */
.view{padding:26px 0 60px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin:34px 0 14px;}
.section-title{font-family:'Libre Baskerville', serif; font-size:20px; font-weight:700;}
.section-sub{font-size:12px; color:var(--text2);}
.page-title{font-family:'Libre Baskerville', serif; font-size:30px; font-weight:700; margin-bottom:6px;}

/* ---------- carousel / grid ---------- */
.hscroll{display:flex; gap:16px; overflow-x:auto; padding:4px 2px 14px; scroll-snap-type:x mandatory;}
.hscroll::-webkit-scrollbar{display:none;}
.grid{display:grid; grid-template-columns:repeat(6,1fr); gap:16px;}
@media (max-width:1024px){.grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr);}}

/* ---------- album cover (generated art) ---------- */
.cover{
  position:relative; aspect-ratio:1/1; border-radius:2px; overflow:hidden;
  display:flex; align-items:flex-end; padding:10px;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.6);
}
.cover .initials{
  font-family:'Libre Baskerville', serif; font-weight:700; font-size:13px;
  color:rgba(244,241,234,.92); text-shadow:0 1px 3px rgba(0,0,0,.4);
}
.cover .vinyl{
  position:absolute; right:-24px; top:50%; transform:translateY(-50%);
  width:70%; aspect-ratio:1/1; border-radius:50%;
  background:radial-gradient(circle at center, #0D0D0F 0 14%, #1c1c1f 15% 16%, transparent 17%),
             repeating-radial-gradient(circle, rgba(0,0,0,.35) 0 2px, transparent 2px 5px);
  opacity:0; transition:opacity .25s, right .25s; pointer-events:none;
}
.album-card{scroll-snap-align:start; flex:0 0 148px; cursor:pointer;}
.album-card .cover{width:148px; height:148px;}
.grid .album-card{width:100%;}
.grid .album-card .cover{width:100%; height:auto;}
.album-card:hover .cover .vinyl{opacity:1; right:-14px;}
.album-card:hover .cover{transform:translateY(-2px);}
.album-name{font-size:13px; font-weight:600; margin-top:9px; line-height:1.3;}
.album-artist{font-size:12px; color:var(--text2); margin-top:2px;}
.album-meta{font-size:11px; color:var(--gold); margin-top:4px; display:flex; align-items:center; gap:4px;}
.quick-actions{
  display:flex; gap:6px; position:absolute; bottom:8px; left:8px; right:8px;
  opacity:0; transition:opacity .2s;
}
.album-card:hover .quick-actions{opacity:1;}
.qa-btn{
  background:rgba(13,13,15,.75); border:1px solid rgba(244,241,234,.25); color:var(--text);
  font-size:10px; padding:5px 6px; border-radius:2px; flex:1; text-align:center; font-weight:600;
}
.qa-btn:hover{background:var(--orange); border-color:var(--orange);}

/* ---------- stars ---------- */
.stars{color:var(--gold); font-size:13px; letter-spacing:1px; white-space:nowrap;}
.star-select{display:inline-flex; gap:3px; cursor:pointer; font-size:26px; color:var(--border);}
.star-select .on{color:var(--gold);}

/* ---------- genre pills ---------- */
.genres{display:flex; flex-wrap:wrap; gap:10px;}
.genre-pill{
  border:1px solid var(--border); padding:16px 20px; border-radius:2px; font-size:13px; font-weight:600;
  background:var(--bg2); flex:1 1 130px; text-align:center; transition:border-color .15s, color .15s;
}
.genre-pill:hover{border-color:var(--orange); color:var(--orange);}

/* ---------- feed / activity cards ---------- */
.feed-card{
  display:flex; gap:14px; padding:18px 0; border-bottom:1px solid var(--border);
}
.feed-card .avatar{width:36px; height:36px; font-size:14px;}
.feed-line{font-size:13px; margin-bottom:8px;}
.feed-line b{font-weight:700;}
.feed-time{color:var(--text2); font-size:11px;}
.feed-body{flex:1; min-width:0;}
.feed-cover-row{display:flex; gap:12px; align-items:flex-start;}
.feed-cover-row .cover{width:64px; height:64px; flex-shrink:0;}
.feed-cover-row .cover .initials{font-size:10px;}
.feed-album{font-weight:700; font-size:14px;}
.feed-artist{color:var(--text2); font-size:12px; margin-bottom:4px;}
.feed-review{font-family:'Libre Baskerville', serif; font-style:italic; font-size:14px; line-height:1.5; color:#E9E6DE; margin-top:6px;}
.feed-actions{display:flex; gap:16px; margin-top:10px; font-size:12px; color:var(--text2);}
.feed-actions span{display:flex; align-items:center; gap:5px; cursor:pointer;}
.feed-actions span:hover{color:var(--text);}
.feed-actions .liked{color:var(--orange);}
.compact-activity{display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;}
.compact-activity .avatar{width:26px; height:26px; font-size:11px;}

/* ---------- buttons ---------- */
.btn{
  padding:11px 18px; border-radius:2px; font-size:12px; font-weight:700; letter-spacing:.3px;
  display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border);
}
.btn-primary{background:var(--orange); border-color:var(--orange); color:#0D0D0F;}
.btn-primary:hover{background:#f0794a;}
.btn-ghost{background:transparent; color:var(--text);}
.btn-ghost:hover{border-color:var(--text2);}
.btn-gold{border-color:var(--gold); color:var(--gold);}
.btn-follow{background:var(--text); color:#0D0D0F; border-color:var(--text);}
.btn-follow.following{background:transparent; color:var(--text2); border-color:var(--border);}
.btn-sm{padding:7px 12px; font-size:11px;}

/* ---------- album page ---------- */
.album-hero{display:flex; gap:36px; margin-bottom:10px;}
.album-hero .cover{width:280px; height:280px; flex-shrink:0;}
.album-hero .cover .initials{font-size:20px;}
@media (max-width:820px){.album-hero{flex-direction:column; gap:18px;} .album-hero .cover{width:100%; height:auto; aspect-ratio:1/1;}}
.ah-artist{font-size:16px; color:var(--text2); margin:6px 0 4px;}
.ah-meta{font-size:13px; color:var(--text2); margin-bottom:14px;}
.ah-rating{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.ah-rating .num{font-family:'Libre Baskerville', serif; font-size:22px; color:var(--gold); font-weight:700;}
.ah-counts{font-size:12px; color:var(--text2); margin-bottom:20px;}
.ah-btns{display:flex; flex-wrap:wrap; gap:10px;}

.tracklist{margin-top:8px;}
.track-row{
  display:flex; align-items:center; gap:14px; padding:11px 4px; border-bottom:1px solid var(--border);
  font-size:13px;
}
.track-num{color:var(--text2); width:20px; flex-shrink:0;}
.track-title{flex:1; font-weight:500;}
.track-dur{color:var(--text2); font-size:12px; width:40px; text-align:right;}
.track-actions{display:flex; align-items:center; gap:10px; opacity:0; transition:opacity .15s;}
.track-row:hover .track-actions{opacity:1;}
.track-my-rating{color:var(--orange); font-size:11px; font-weight:700; width:50px; text-align:right;}

.review-card{padding:20px 0; border-bottom:1px solid var(--border);}
.review-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.review-name{font-weight:700; font-size:13px;}
.review-date{font-size:11px; color:var(--text2);}
.review-actions{display:flex; gap:18px; margin-top:12px; font-size:12px; color:var(--text2);}
.review-actions span{cursor:pointer;}
.review-actions span:hover{color:var(--text);}

/* ---------- profile ---------- */
.profile-head{display:flex; gap:24px; align-items:center; margin-bottom:22px; flex-wrap:wrap;}
.profile-head .avatar{width:88px; height:88px; font-size:30px;}
.profile-name{font-family:'Libre Baskerville', serif; font-size:24px; font-weight:700;}
.profile-handle{color:var(--text2); font-size:13px; margin-bottom:8px;}
.profile-bio{font-size:13px; color:#cfcdc7; max-width:420px; margin-bottom:10px;}
.profile-stats{display:flex; gap:22px; font-size:13px;}
.profile-stats b{display:block; font-size:15px;}
.profile-stats span{color:var(--text2); font-size:11px;}
.favorites-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:600px){.favorites-grid{grid-template-columns:repeat(2,1fr);}}
.stat-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media (max-width:700px){.stat-cards{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--bg2); border:1px solid var(--border); padding:16px; border-radius:2px;}
.stat-card .num{font-family:'Libre Baskerville',serif; font-size:24px; font-weight:700; color:var(--gold);}
.stat-card .lab{font-size:11px; color:var(--text2); margin-top:3px;}

/* ---------- diary ---------- */
.diary-group{margin-bottom:26px;}
.diary-month{font-family:'Libre Baskerville', serif; font-size:15px; color:var(--text2); margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border);}
.diary-row{display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--border);}
.diary-day{width:26px; font-size:13px; color:var(--text2); flex-shrink:0;}
.diary-row .cover{width:52px; height:52px; flex-shrink:0;}
.diary-row .cover .initials{font-size:9px;}
.diary-info{flex:1; min-width:0;}
.diary-fav{font-size:11px; color:var(--text2); margin-top:2px;}
.diary-actions{display:flex; gap:12px; font-size:11px; color:var(--text2);}
.diary-actions span{cursor:pointer;}
.diary-actions span:hover{color:var(--orange);}
.filter-row{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
.filter-chip{border:1px solid var(--border); padding:7px 13px; font-size:12px; border-radius:20px; color:var(--text2); cursor:pointer;}
.filter-chip.active{border-color:var(--orange); color:var(--orange);}

/* ---------- search ---------- */
.search-hero-input{
  width:100%; padding:16px 18px; font-size:16px; background:var(--bg2); border:1px solid var(--border);
  color:var(--text); border-radius:2px; outline:none;
}
.search-hero-input:focus{border-color:var(--orange);}
.tab-row{display:flex; gap:24px; margin:18px 0 20px; border-bottom:1px solid var(--border);}
.tab{padding-bottom:10px; font-size:13px; font-weight:700; color:var(--text2); border-bottom:2px solid transparent; cursor:pointer;}
.tab.active{color:var(--text); border-color:var(--orange);}
.result-row{display:flex; align-items:center; gap:14px; padding:11px 0; border-bottom:1px solid var(--border);}
.result-row .cover{width:44px; height:44px; flex-shrink:0;}
.result-row .cover .initials{font-size:8px;}
.result-title{font-size:13px; font-weight:600;}
.result-sub{font-size:11px; color:var(--text2);}
.result-row .avatar{width:44px; height:44px;}

/* ---------- empty states ---------- */
.empty{text-align:center; padding:60px 20px; color:var(--text2);}
.empty .serif{font-size:18px; color:var(--text); margin-bottom:6px; display:block;}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.65); backdrop-filter:blur(2px); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px;}
.modal{background:var(--card); border:1px solid var(--border); border-radius:3px; width:100%; max-width:420px; max-height:88vh; overflow-y:auto; padding:24px;}
.modal-title{font-family:'Libre Baskerville', serif; font-size:18px; font-weight:700; margin-bottom:18px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:11px; color:var(--text2); margin-bottom:6px; font-weight:600;}
.field input[type=date], .field select, .field textarea{
  width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text); padding:10px 12px;
  border-radius:2px; font-family:inherit; font-size:13px; outline:none;
}
.field textarea{min-height:80px; resize:vertical;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--orange);}
.checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:18px;}
.modal-close{position:absolute; margin-left:calc(100% - 30px); margin-top:-8px; font-size:20px; color:var(--text2); cursor:pointer;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:6px;}

/* ---------- toast ---------- */
#toast{
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--text); color:#0D0D0F; padding:12px 20px; border-radius:3px; font-size:13px; font-weight:600;
  opacity:0; transition:opacity .25s, transform .25s; z-index:200; pointer-events:none;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
@media (min-width:821px){#toast{bottom:24px;}}

.breadcrumb{font-size:12px; color:var(--text2); margin-bottom:16px; cursor:pointer;}
.breadcrumb:hover{color:var(--text);}

/* ================= v2: hero, richer covers, streak, tutorial ================= */
.page-title{font-size:34px; letter-spacing:-.3px;}
.section-title{font-size:21px;}
h1,h2,h3{font-family:'Libre Baskerville', serif;}

/* --- hero spotlight (Home) --- */
.hero-spot{
  position:relative; display:flex; align-items:center; gap:40px;
  border:1px solid var(--border); border-radius:4px; overflow:hidden;
  padding:34px; margin-bottom:8px; min-height:230px;
}
.hero-spot .cover{width:170px; height:170px; flex-shrink:0; box-shadow:0 20px 40px -14px rgba(0,0,0,.7);}
.hero-eyebrow{font-size:12px; color:var(--gold); font-weight:700; margin-bottom:10px;}
.hero-title{font-family:'Libre Baskerville', serif; font-size:36px; font-weight:700; line-height:1.1; margin-bottom:8px;}
.hero-sub{font-size:14px; color:var(--text2); margin-bottom:18px; max-width:420px;}
@media (max-width:700px){
  .hero-spot{flex-direction:column; align-items:flex-start; gap:18px; padding:22px;}
  .hero-spot .cover{width:120px; height:120px;}
  .hero-title{font-size:26px;}
}

/* --- richer generated cover art --- */
.cover{background-size:cover;}
.cover .art-shape{position:absolute; border-radius:50%; mix-blend-mode:screen; filter:blur(1px);}
.cover .art-grain{
  position:absolute; inset:0; opacity:.16; pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.7) .6px, transparent .6px);
  background-size:5px 5px;
}
.cover .art-band{position:absolute; left:0; right:0; mix-blend-mode:overlay;}
.cover .initials{position:relative; z-index:2; letter-spacing:.5px;}

/* --- streak / xp badge --- */
.streak-badge{
  display:flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--gold);
  border:1px solid var(--border); padding:6px 10px; border-radius:20px; background:var(--bg2); white-space:nowrap;
}
.streak-badge .flame{filter:drop-shadow(0 0 4px rgba(229,185,75,.5));}
.xp-toast{color:var(--gold);}

/* --- write review CTA --- */
.review-cta{
  display:flex; align-items:center; gap:14px; border:1px dashed var(--border); border-radius:3px;
  padding:16px 18px; margin:6px 0 20px; cursor:pointer; transition:border-color .15s, background .15s;
}
.review-cta:hover{border-color:var(--orange); background:rgba(232,106,51,.06);}
.review-cta .rc-icon{
  width:38px; height:38px; border-radius:50%; background:var(--orange); color:#0D0D0F; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700;
}
.review-cta .rc-text b{display:block; font-size:14px;}
.review-cta .rc-text span{font-size:12px; color:var(--text2);}
.fab{
  position:fixed; right:20px; bottom:78px; z-index:60; width:52px; height:52px; border-radius:50%;
  background:var(--orange); color:#0D0D0F; font-size:26px; font-weight:700; display:flex; align-items:center;
  justify-content:center; box-shadow:0 10px 24px -8px rgba(232,106,51,.6);
}
@media (min-width:821px){.fab{bottom:28px;}}

/* --- onboarding tutorial --- */
.tut-overlay{position:fixed; inset:0; background:rgba(6,6,7,.86); z-index:500; display:flex; align-items:center; justify-content:center; padding:20px;}
.tut-card{background:var(--card); border:1px solid var(--border); border-radius:4px; max-width:420px; width:100%; padding:30px; position:relative;}
.tut-step-icon{width:46px; height:46px; border-radius:50%; background:rgba(232,106,51,.14); color:var(--orange); display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:18px;}
.tut-title{font-family:'Libre Baskerville', serif; font-size:20px; font-weight:700; margin-bottom:10px;}
.tut-text{font-size:13px; color:#cfcdc7; line-height:1.6; margin-bottom:22px;}
.tut-dots{display:flex; gap:6px; margin-bottom:22px;}
.tut-dots span{width:6px; height:6px; border-radius:50%; background:var(--border);}
.tut-dots span.on{background:var(--orange); width:18px; border-radius:4px;}
.tut-actions{display:flex; justify-content:space-between; align-items:center;}
.tut-count{font-size:11px; color:var(--text2);}

/* ================= v3: visual polish & photographic catalog ================= */
body{background:
  radial-gradient(circle at 15% -10%, rgba(232,106,51,.11), transparent 28%),
  radial-gradient(circle at 92% 6%, rgba(229,185,75,.07), transparent 25%),
  var(--bg);}
header.top{box-shadow:0 10px 35px rgba(0,0,0,.18);}
.logo{font-size:20px; letter-spacing:1.2px;}
.logo .dot{box-shadow:0 0 18px rgba(232,106,51,.75);}
.hero-spot{border-color:rgba(255,255,255,.08); box-shadow:0 24px 70px -42px rgba(0,0,0,.95);}
.hero-spot:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,10,.12),rgba(8,8,10,.38));pointer-events:none;}
.hero-spot>*{position:relative;z-index:2;}
.album-card .cover{transition:transform .22s ease, box-shadow .22s ease; background:#171719;}
.album-card:hover .cover{transform:translateY(-4px) scale(1.015);box-shadow:0 18px 34px -14px rgba(0,0,0,.8);}
.cover-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;filter:saturate(.9) contrast(1.03);transition:transform .35s ease,filter .35s ease;}
.album-card:hover .cover-photo{transform:scale(1.035);filter:saturate(1.05) contrast(1.06);}

const GENRES = ["Rock","Alternative","Hip-Hop","Jazz","Electronic","Pop","Metal","R&B","Indie","Folk","Soul"];

function hashStr(s){let h=0; for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i); h|=0;} return Math.abs(h);}
function hueFromString(s){return hashStr(s)%360;}
function coverStyle(title){
  const h = hueFromString(title);
  const h2 = (h+38)%360;
  return `background:linear-gradient(155deg, hsl(${h} 46% 22%) 0%, hsl(${h2} 60% 14%) 60%, hsl(${h} 30% 8%) 100%);`;
}
function initialsOf(t){return t.split(" ").filter(w=>w.length).slice(0,3).map(w=>w[0]).join("").toUpperCase();}

/* Generative "album art": each cover is procedurally composed from the title/artist hash so
   every record gets a distinct, poster-like abstract identity — no real artwork is reproduced. */
const ART_MOTIFS = ["orbit","stripes","horizon","shards","field"];
function coverArtHTML(seed){
  const h1 = hashStr(seed);
  const h2 = hashStr(seed+"x");
  const hue = h1%360;
  const hue2 = (hue + 34 + (h2%40))%360;
  const hue3 = (hue + 200 + (h1%30))%360;
  const motif = ART_MOTIFS[h1%ART_MOTIFS.length];
  let shapes = "";
  if(motif==="orbit"){
    shapes = `<div class="art-shape" style="width:120%;height:120%;left:${-20+h2%30}%;top:${-30+h1%40}%;background:radial-gradient(circle, hsla(${hue3},80%,60%,.55), transparent 60%);"></div>
      <div class="art-shape" style="width:55%;height:55%;right:${-10+h1%20}%;bottom:${-15+h2%25}%;background:radial-gradient(circle, hsla(${hue2},75%,55%,.5), transparent 65%);"></div>`;
  } else if(motif==="stripes"){
    shapes = `<div class="art-band" style="top:${20+h1%15}%; height:${10+h2%14}px; background:hsla(${hue2},70%,55%,.55); transform:rotate(${-8+h1%16}deg);"></div>
      <div class="art-band" style="top:${50+h2%20}%; height:${6+h1%10}px; background:hsla(${hue3},70%,60%,.4); transform:rotate(${-8+h2%16}deg);"></div>
      <div class="art-shape" style="width:60%;height:60%;right:-15%;top:-15%;background:radial-gradient(circle, hsla(${hue},70%,55%,.35), transparent 70%);"></div>`;
  } else if(motif==="horizon"){
    shapes = `<div class="art-shape" style="width:140%;height:80%;left:-20%;bottom:-40%;border-radius:50%;background:radial-gradient(circle, hsla(${hue2},75%,55%,.6), transparent 65%);"></div>
      <div class="art-band" style="top:${30+h1%20}%; height:2px; background:hsla(${hue3},60%,75%,.5);"></div>`;
  } else if(motif==="shards"){
    shapes = `<div class="art-shape" style="width:70%;height:70%;left:${-10+h1%25}%;top:${-20+h2%30}%;border-radius:20%;transform:rotate(${h1%45}deg);background:linear-gradient(135deg, hsla(${hue2},70%,55%,.55), transparent 70%);"></div>
      <div class="art-shape" style="width:45%;height:45%;right:${-5+h2%20}%;bottom:${-10+h1%25}%;border-radius:30%;transform:rotate(${h2%60}deg);background:linear-gradient(135deg, hsla(${hue3},70%,60%,.5), transparent 70%);"></div>`;
  } else {
    shapes = `<div class="art-shape" style="width:90%;height:90%;left:${5+h1%15}%;top:${5+h2%15}%;background:radial-gradient(circle, hsla(${hue2},70%,55%,.45) 0%, transparent 55%);"></div>
      <div class="art-shape" style="width:40%;height:40%;right:10%;bottom:10%;background:radial-gradient(circle, hsla(${hue3},75%,60%,.5), transparent 65%);"></div>
      <div class="art-shape" style="width:22%;height:22%;left:12%;bottom:16%;background:radial-gradient(circle, hsla(${hue},80%,65%,.55), transparent 70%);"></div>`;
  }
  return `<div class="art-grain"></div>${shapes}`;
}
function coverPhotoURL(title){
  const al = (typeof ALBUMS!=="undefined") ? ALBUMS.find(a=>a.title===title) : null;
  const seed = encodeURIComponent((al?.id || title).toLowerCase().replace(/[^a-z0-9]+/g,'-'));
  // Remote photographic artwork for the prototype; generated CSS remains as a graceful fallback.
  return `https://picsum.photos/seed/groovebox-${seed}/700/700`;
}
function coverHTML(title, extraClass, seedExtra){
  const seed = title + (seedExtra||"");
  const src = coverPhotoURL(title);
  return `<div class="cover ${extraClass||''}" style="${coverStyle(title)}; position:relative;">
    ${coverArtHTML(seed)}
    <img class="cover-photo" src="${src}" alt="Cover for ${escapeHTML(title)}" loading="lazy" onerror="this.style.display='none'">
    <div class="vinyl"></div>
    <div class="initials">${initialsOf(title)}</div>
  </div>`;
}
function avatarStyle(name){
  const h = hueFromString(name);
  return `background:hsl(${h} 55% 62%);`;
}
function avatarHTML(name, size){
  return `<div class="avatar" style="${avatarStyle(name)}">${(name||'?')[0].toUpperCase()}</div>`;
}

  const names = ["Intro","Silhouette","Weightless","Static Bloom","Nightdrive","Amber Room","Slow Static","Glass Water","Faultline","In Reverse","Low Light","Afterglow","Marigold","Undertow","Paper Moon","Velvet Morning","Neon River","Sunday Cinema","No Signal","Blue Motel","Parallel Lines","Soft Landing","Golden Hour","Nocturne","Fever Dream","Half Awake","City Lights","Falling Forward","Satellite","Memory Lane","Cold Coffee","Sunroom","Midnight Radio","Out of Frame","Summer Rain","Second Skin","Daybreak","Quiet Fire","Northbound","Open Window","Slow Motion","Wildflower","Blackout","Dream State","Red Room","Last Train","Side B","Cloud Nine","Home Again","Mirage","Tape Hiss","After Midnight","Small Hours","Crossfade","Echo Chamber","Moonlit","Streetlight","Borrowed Time","Interlude","Finale"];
  const out=[];
  for(let i=0;i<n;i++){

  return out;
}

/* ============================= HELPERS ============================= */
function albumById(id){return ALBUMS.find(a=>a.id===id);}
function userById(id){return USERS[id];}
function starsHTML(rating){
  const full = Math.floor(rating);
  const half = rating - full >= 0.5;
  let s = "★".repeat(full);
  if(half) s += "½";
  return `<span class="stars">${s} <span style="color:var(--text2)">${rating.toFixed(1)}</span></span>`;
}
function fmtCount(n){
  if(n>=1000) return (n/1000).toFixed(n>=10000?0:1)+"K";
  return n;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function escapeHTML(s){return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* ============================= ROUTER ============================= */
function currentRoute(){
  const h = location.hash.replace(/^#\//,'') || 'home';
  return h.split('/');
}
function navigate(route){ location.hash = '#/'+route; }
window.addEventListener('hashchange', render);

function setActiveNav(routeBase){
  document.querySelectorAll('#navPrimary a, #navMobile a').forEach(a=>{

function albumCard(al, showQuick){

}

function activityCard(act){
  const u = userById(act.user);
  if(act.type==="followed"){
    const t = userById(act.target);
    return `<div class="compact-activity">
      ${avatarHTML(u.name)}
      <div>${userLink(u)} followed ${userLink(t)} <span class="feed-time">· ${act.time}</span></div>
    </div>`;
  }
  const al = albumById(act.albumId);
  if(act.type==="reviewed"){
    return `<div class="feed-card">
      ${avatarHTML(u.name)}
      <div class="feed-body">
        <div class="feed-line">${userLink(u)} reviewed <span class="feed-time">· ${act.time}</span></div>

        </div>
        <div class="feed-review">"${escapeHTML(act.text)}"</div>
        <div class="feed-actions">
          <span class="${act.liked?'liked':''}" onclick="toggleLike(${act.id})">${act.liked?'♥':'♡'} ${fmtCount(act.likes)}</span>
          <span onclick="navigate('album/${al.id}')">💬 ${fmtCount(act.comments)}</span>
        </div>
      </div>
    </div>`;

  const verb = act.type==="logged" ? "listened to" : "rated";
  return `<div class="feed-card">
    ${avatarHTML(u.name)}
    <div class="feed-body">
      <div class="feed-line">${userLink(u)} ${verb} <a onclick="navigate('album/${al.id}')" style="cursor:pointer">${al.title}</a> ${starsHTML(act.rating)} <span class="feed-time">· ${act.time}</span></div>

}
function userLink(u){return `<a onclick="navigate('profile/${u.id}')" style="cursor:pointer;font-weight:700">@${u.username}</a>`;}

function toggleLike(actId){
  const act = ACTIVITY.find(a=>a.id===actId);
  if(!act) return;
  act.liked = !act.liked;
  act.likes += act.liked ? 1 : -1;
  render();
}

    resultsHTML = `<div class="empty"><span class="serif">Search GROOVEBOX</span>Find an album, a song, an artist or a person.</div>`;
  } else {
    const showAlbums = searchTab==="ALL"||searchTab==="ALBUMS";

    const showArtists = searchTab==="ALL"||searchTab==="ARTISTS";

      resultsHTML += `<div class="section-sub" style="margin-bottom:8px;">ALBUMS</div>` + albums.map(a=>`

          <div><div class="result-title">${t.title}</div><div class="result-sub">${t.album.artist} · ${t.album.title}</div></div>

  render();
}

    <div style="display:flex; align-items:center; gap:18px; margin-bottom:8px;">

let diaryFilter = {year:'ALL'};
function view_diary(){
  const years = [...new Set(DIARY.map(d=>d.date.slice(0,4)))].sort().reverse();
  let entries = [...DIARY].sort((a,b)=>b.date.localeCompare(a.date));
  if(diaryFilter.year!=='ALL') entries = entries.filter(d=>d.date.slice(0,4)===diaryFilter.year);

  const groups = {};
  entries.forEach(e=>{
    const d = new Date(e.date+"T00:00");
    const key = d.toLocaleDateString('en-US',{month:'long', year:'numeric'}).toUpperCase();
    (groups[key]=groups[key]||[]).push(e);
  });

  return `
    <div class="page-title">My Diary</div>
    <div class="filter-row">
      <div class="filter-chip ${diaryFilter.year==='ALL'?'active':''}" onclick="diaryFilter.year='ALL'; render();">ALL YEARS</div>
      ${years.map(y=>`<div class="filter-chip ${diaryFilter.year===y?'active':''}" onclick="diaryFilter.year='${y}'; render();">${y}</div>`).join('')}
    </div>
    ${entries.length===0?`<div class="empty"><span class="serif">Your diary is empty.</span>Time to spin something.</div>`:''}
    ${Object.entries(groups).map(([month, list])=>`
      <div class="diary-group">
        <div class="diary-month">${month}</div>
        ${list.map(e=>{
          const al = albumById(e.albumId);
          const day = e.date.slice(8,10);
          return `<div class="diary-row">
            <div class="diary-day">${day}</div>
            <div onclick="navigate('album/${al.id}')" style="cursor:pointer">${coverHTML(al.title)}</div>
            <div class="diary-info">
              <div class="feed-album">${al.title}</div>
              <div class="feed-artist">${al.artist}</div>
              ${starsHTML(e.rating)}
              ${e.fav?`<div class="diary-fav">Favorite track: ${e.fav}</div>`:''}
            </div>
            <div class="diary-actions">
              <span onclick="openLogModal('${al.id}', ${e.id})">EDIT</span>
              <span onclick="deleteDiaryEntry(${e.id})">DELETE</span>
              ${e.review?`<span onclick="showToast('Opening review…')">VIEW REVIEW</span>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>
    `).join('')}
  `;
}
function deleteDiaryEntry(id){
  DIARY = DIARY.filter(d=>d.id!==id);
  showToast('Entry deleted');
  render();
}

/* ============================= MODALS ============================= */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function openRateModal(albumId){
  const al = albumById(albumId);
  const current = userAlbumRatings[albumId] || 0;
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-title serif">Rate ${al.title}</div>
        <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px;">
          ${coverHTML(al.title)}
          <div>
            <div style="font-weight:700;">${al.title}</div>
            <div class="section-sub">${al.artist}</div>
          </div>
        </div>
        <div class="field">
          <label>YOUR RATING</label>
          ${halfStarSelector('rateModalStars', current)}
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitRate('${albumId}')">SAVE RATING</button>
        </div>
      </div>
    </div>`;
}
function submitRate(albumId){
  const val = window._pendingRating || userAlbumRatings[albumId] || 0;
  if(!val){ showToast('Select a rating first'); return; }
  userAlbumRatings[albumId] = val;
  const al = albumById(albumId);
  ACTIVITY.unshift({id:Date.now(), type:"rated", user:"me", albumId, rating:val, time:"Just now"});
  closeModal();
  showToast(`Rated ${al.title} ${val.toFixed(1)}★`);
  registerActivityForReward('rate');
  render();
}

function openTrackRateModal(albumId, trackId){
  const al = albumById(albumId);
  const t = al.tracklist.find(t=>t.id===trackId);
  const current = userTrackRatings[trackId] || 0;
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-title serif">Rate ${t.title}</div>
        <div class="section-sub" style="margin-bottom:16px;">${al.title} — ${al.artist}</div>
        <div class="field">
          <label>YOUR RATING</label>
          ${halfStarSelector('rateModalStars', current)}
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitTrackRate('${trackId}','${t.title.replace(/'/g,"\\'")}')">SAVE RATING</button>
        </div>
      </div>
    </div>`;
}
function submitTrackRate(trackId, title){
  const val = window._pendingRating || userTrackRatings[trackId] || 0;
  if(!val){ showToast('Select a rating first'); return; }
  userTrackRatings[trackId] = val;
  closeModal();
  showToast(`Rated "${title}" ${val.toFixed(1)}★`);
  registerActivityForReward('rate');
  render();
}

function halfStarSelector(name, current){
  window._pendingRating = current;
  let stars = '';
  for(let i=1;i<=5;i++){
    const filled = current>=i;
    const half = !filled && current>=i-0.5;
    stars += `<span style="position:relative; display:inline-block;">
      <span class="star-glyph" style="color:var(--border)">★</span>
      <span style="position:absolute; left:0; top:0; overflow:hidden; width:${filled?'100%':half?'50%':'0%'}; color:var(--gold);">★</span>
      <span onclick="setHalfStar(event, ${i})" data-half="1" style="position:absolute; left:0; top:0; width:50%; height:100%; cursor:pointer;"></span>
      <span onclick="setHalfStar(event, ${i})" data-half="0" style="position:absolute; right:0; top:0; width:50%; height:100%; cursor:pointer;"></span>
    </span>`;
  }
  return `<div class="star-select" id="starSelectWrap" style="font-size:30px;">${stars}</div>
    <div id="ratingValueLabel" class="section-sub" style="margin-top:8px;">${current? current.toFixed(1)+' / 5':'Tap a star to rate'}</div>`;
}
function setHalfStar(e, starIndex){
  const isLeftHalf = e.target.dataset.half==='1';
  const val = isLeftHalf ? starIndex-0.5 : starIndex;
  window._pendingRating = val;
  const wrap = document.getElementById('starSelectWrap');
  const spans = wrap.querySelectorAll(':scope > span');
  spans.forEach((sp, idx)=>{
    const i = idx+1;
    const fillSpan = sp.children[1];
    if(val>=i) fillSpan.style.width='100%';
    else if(val>=i-0.5) fillSpan.style.width='50%';
    else fillSpan.style.width='0%';
  });
  document.getElementById('ratingValueLabel').textContent = val.toFixed(1)+' / 5';
}

function openLogModal(albumId, editEntryId, focusReview){
  const al = albumById(albumId);
  const editing = editEntryId ? DIARY.find(d=>d.id===editEntryId) : null;
  const today = new Date().toISOString().slice(0,10);
  const current = editing ? editing.rating : (userAlbumRatings[albumId]||0);
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-title serif">${focusReview?'Write a review':'Log this album'}</div>
        <div style="display:flex; align-items:center; gap:16px; margin-bottom:18px;">
          ${coverHTML(al.title)}
          <div><div style="font-weight:700;">${al.title}</div><div class="section-sub">${al.artist}</div></div>
        </div>
        <div class="field">
          <label>DATE</label>
          <input type="date" id="logDate" value="${editing?editing.date:today}">
        </div>
        <div class="field">
          <label>RATING</label>
          ${halfStarSelector('logStars', current)}
        </div>
        <div class="field">
          <label>REVIEW</label>
          <textarea id="logReview" placeholder="Write something about this album...">${editing?escapeHTML(editing.review):''}</textarea>
        </div>
        <div class="field">
          <label>FAVORITE TRACK</label>
          <select id="logFavTrack">
            <option value="">Select track…</option>
            ${al.tracklist.map(t=>`<option value="${escapeHTML(t.title)}" ${editing&&editing.fav===t.title?'selected':''}>${t.title}</option>`).join('')}
          </select>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="logFavAlbum" ${USERS.me.favorites.includes(albumId)?'checked':''}>
          <label for="logFavAlbum" style="margin:0; font-size:13px; color:var(--text);">♡ Add to favorites</label>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitLog('${albumId}', ${editing?editing.id:'null'})">SAVE TO DIARY</button>
        </div>
      </div>
    </div>`;
  if(focusReview){
    setTimeout(()=>{
      const ta = document.getElementById('logReview');
      if(ta){ ta.focus(); ta.scrollIntoView({block:'center', behavior:'smooth'}); }
    }, 60);
  }
}
function submitLog(albumId, editId){
  const date = document.getElementById('logDate').value;
  const rating = window._pendingRating || 0;
  const review = document.getElementById('logReview').value.trim();
  const fav = document.getElementById('logFavTrack').value;
  const addFav = document.getElementById('logFavAlbum').checked;
  if(!date){ showToast('Pick a date'); return; }
  if(!rating){ showToast('Add a rating'); return; }

  if(editId){
    const entry = DIARY.find(d=>d.id===editId);
    Object.assign(entry, {date, rating, review, fav});
  } else {
    DIARY.unshift({id:Date.now(), albumId, date, rating, review, fav});
  }
  userAlbumRatings[albumId] = rating;

  if(addFav && !USERS.me.favorites.includes(albumId)){
    if(USERS.me.favorites.length<4) USERS.me.favorites.push(albumId);
  } else if(!addFav){
    USERS.me.favorites = USERS.me.favorites.filter(id=>id!==albumId);
  }

  if(review){
    ACTIVITY.unshift({id:Date.now()+1, type:"reviewed", user:"me", albumId, rating, time:"Just now", text:review, likes:0, comments:0, liked:false});
  } else {
    ACTIVITY.unshift({id:Date.now()+1, type:"logged", user:"me", albumId, rating, time:"Just now"});
  }
  closeModal();
  showToast('Added to your diary ✓');
  registerActivityForReward('log');
  render();
}

/* ============================= STREAK / REWARD SYSTEM ============================= */
function updateStreakUI(){
  ['streakCountDesktop','streakCountMobile'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.textContent = streak;
  });
}
function registerActivityForReward(kind){
  // one streak bump per session keeps the "logged in today" feeling honest,
  // while every action still earns XP so each log/rating feels rewarded.
  let gained = kind==='log' ? 15 : 6;
  let msg = kind==='log' ? `+${gained} XP por registrar en tu diario` : `+${gained} XP por calificar`;
  if(!loggedThisSession){
    loggedThisSession = true;
    streak += 1;
    gained += 10;
    msg = `🔥 Racha de ${streak} días — +${gained} XP`;
    if(streak>0 && streak%7===0){
      msg = `🔥 ¡${streak} días seguidos! Racha de una semana — +${gained} XP`;
    }
  }
  xp += gained;
  updateStreakUI();
  setTimeout(()=>showToast(msg), kind==='log'?650:0);
}

/* ============================= ONBOARDING TUTORIAL ============================= */
let tutorialSeen = false;
const TUTORIAL_STEPS = [
  {icon:"🎧", title:"Bienvenido a GROOVEBOX", text:"Este es tu diario musical: aquí registras lo que escuchas, lo calificas y ves qué escuchan las personas que sigues. Un recorrido rápido de 5 pasos y listo."},
  {icon:"🧭", title:"Navegación principal", text:"Home, Discover, Diary, Search y Profile son tus cinco secciones. En escritorio están arriba; en el celular, abajo. El logo siempre te regresa a Home."},
  {icon:"★", title:"Calificar es el gesto base", text:"En cualquier portada o en la página de un álbum, el botón ★ RATE abre un selector de medias estrellas (0.5 a 5). Puedes calificar álbumes y también canciones sueltas en el tracklist."},
  {icon:"＋", title:"Registrar en tu diario", text:"＋ LOG abre el modal para guardar la fecha en que escuchaste el álbum, tu reseña y tu canción favorita. Puedes registrar el mismo álbum varias veces para ver cómo cambia tu gusto."},
  {icon:"🔥", title:"Tu racha te acompaña", text:"Cada vez que entras y registras algo, tu racha 🔥 (arriba a la derecha) sube y ganas puntos XP. Es tu manera de ver tu constancia como oyente a lo largo del tiempo."},
];
let tutorialStepIdx = 0;
function maybeStartTutorial(){
  if(tutorialSeen) return;
  tutorialStepIdx = 0;
  renderTutorialStep();
}
function renderTutorialStep(){
  const step = TUTORIAL_STEPS[tutorialStepIdx];
  const isLast = tutorialStepIdx === TUTORIAL_STEPS.length-1;
  document.getElementById('modalRoot').innerHTML = `
    <div class="tut-overlay">
      <div class="tut-card">
        <div class="tut-step-icon">${step.icon}</div>
        <div class="tut-title serif">${step.title}</div>
        <div class="tut-text">${step.text}</div>
        <div class="tut-dots">${TUTORIAL_STEPS.map((_,i)=>`<span class="${i===tutorialStepIdx?'on':''}"></span>`).join('')}</div>
        <div class="tut-actions">
          <span class="tut-count">Paso ${tutorialStepIdx+1} de ${TUTORIAL_STEPS.length}</span>
          <button class="btn btn-primary" onclick="advanceTutorial()">${isLast?'EMPEZAR':'SIGUIENTE'}</button>
        </div>
      </div>
    </div>`;
}
function advanceTutorial(){
  if(tutorialStepIdx < TUTORIAL_STEPS.length-1){
    tutorialStepIdx++;
    renderTutorialStep();
  } else {
    tutorialSeen = true;
    document.getElementById('modalRoot').innerHTML = '';
    showToast('Tutorial completado — ¡a construir tu historial musical!');
  }
}

function openQuickReview(){
  const [route, param] = currentRoute();
  if(route==='album' && param){ openLogModal(param, null, true); return; }
  navigate('search');
  showToast('Busca un álbum para reseñarlo');
}

/* ============================= MAIN RENDER ============================= */
function render(){
  const [route, param, param2] = currentRoute();
  const viewEl = document.getElementById('view');
  let base = route;
  document.getElementById('headerAvatar').style.cssText = avatarStyle('Tu perfil');
  document.getElementById('headerAvatar').textContent = 'T';
  updateStreakUI();

  switch(route){
    case 'home': viewEl.innerHTML = view_home(); break;
    case 'discover': viewEl.innerHTML = view_discover(); break;
    case 'search': viewEl.innerHTML = view_search(); break;
    case 'diary': viewEl.innerHTML = view_diary(); break;
    case 'album': viewEl.innerHTML = view_album(param); break;
    case 'artist': viewEl.innerHTML = view_artist(param); break;
    case 'profile': viewEl.innerHTML = view_profile(param); break;
    default: viewEl.innerHTML = view_home(); base='home';
  }
  setActiveNav(base);
  window.scrollTo({top:0});
}

render();
maybeStartTutorial();
